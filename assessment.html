<!DOCTYPE html>
<html lang="ms">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Assessment | VASS</title>

    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Assessment CSS -->
    <link rel="stylesheet"
          href="css/assessment.css">

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="top-header">

    <div class="brand">

        <img src="assets/images/logo.png"
             alt="VASS Logo"
             class="header-logo">

        <div class="brand-text">

            <div class="brand-title">
                VASS
            </div>

            <div class="brand-subtitle">
                Learning Analytics System
            </div>

        </div>

    </div>


    <div class="step-counter"
         id="topStep">

        STEP 1 OF 16

    </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="assessment-container">


    <!-- PROGRESS -->

    <div class="progress-section">

        <div class="progress">

            <div class="progress-bar"
                 id="progressBar"
                 role="progressbar"
                 style="width: 6.25%;">

            </div>

        </div>


        <div class="progress-label">

            <span id="questionNumber">
                1 / 16
            </span>

            <span>
                Questions
            </span>

        </div>

    </div>



    <!-- =================================================
         QUESTION CARD
    ================================================== -->

    <section class="question-card">


        <!-- SECTION ICON -->

        <div class="section-icon"
             id="sectionIcon">

            👁️

        </div>



        <!-- QUESTION NUMBER -->

        <div class="question-label"
             id="questionLabel">

            QUESTION 1

        </div>



        <!-- QUESTION -->

        <h1 id="questionText">

            Saya lebih mudah memahami sesuatu apabila
            maklumat disampaikan melalui gambar atau visual.

        </h1>



        <!-- INSTRUCTION -->

        <p class="instruction">

            Pilih jawapan yang paling menggambarkan diri anda.

        </p>



        <!-- =================================================
             LIKERT OPTIONS
        ================================================== -->

        <div class="likert-container"
             id="likertContainer">


            <!-- OPTION 1 -->

            <button class="likert-option"
                    data-value="1">

                <div class="likert-number">
                    1
                </div>

                <div class="likert-text">
                    Sangat Tidak Setuju
                </div>

            </button>



            <!-- OPTION 2 -->

            <button class="likert-option"
                    data-value="2">

                <div class="likert-number">
                    2
                </div>

                <div class="likert-text">
                    Tidak Setuju
                </div>

            </button>



            <!-- OPTION 3 -->

            <button class="likert-option"
                    data-value="3">

                <div class="likert-number">
                    3
                </div>

                <div class="likert-text">
                    Neutral
                </div>

            </button>



            <!-- OPTION 4 -->

            <button class="likert-option"
                    data-value="4">

                <div class="likert-number">
                    4
                </div>

                <div class="likert-text">
                    Setuju
                </div>

            </button>



            <!-- OPTION 5 -->

            <button class="likert-option"
                    data-value="5">

                <div class="likert-number">
                    5
                </div>

                <div class="likert-text">
                    Sangat Setuju
                </div>

            </button>

        </div>



        <!-- =================================================
             NAVIGATION
        ================================================== -->

        <div class="navigation">


            <button id="backButton"
                    class="nav-button back-button"
                    type="button">

                <span>
                    ←
                </span>

                Back

            </button>



            <button id="nextButton"
                    class="nav-button next-button"
                    type="button">

                Next

                <span>
                    →
                </span>

            </button>


        </div>


    </section>


</main>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


/* =====================================================
   GOOGLE APPS SCRIPT URL
===================================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwQjCyn00rsMQqzPldkNCUetSRK9au6bGCcvnHAww13Eu5sc-zql3sFCJkT0887eaKTbw/exec";



/* =====================================================
   QUESTIONS
===================================================== */

const questions = [

    {
        type: "visual",
        icon: "👁️",
        text: "Saya lebih mudah memahami sesuatu apabila maklumat disampaikan melalui gambar atau visual."
    },

    {
        type: "visual",
        icon: "👁️",
        text: "Saya suka menggunakan warna, simbol atau peta minda untuk membantu saya mengingati maklumat."
    },

    {
        type: "visual",
        icon: "👁️",
        text: "Saya lebih suka melihat contoh atau demonstrasi sebelum melakukan sesuatu tugasan."
    },

    {
        type: "visual",
        icon: "👁️",
        text: "Saya gemar menggunakan carta, rajah atau grafik ketika belajar."
    },


    {
        type: "audio",
        icon: "🎧",
        text: "Saya lebih mudah memahami sesuatu apabila mendengar penerangan daripada guru."
    },

    {
        type: "audio",
        icon: "🎧",
        text: "Saya suka berbincang tentang sesuatu topik untuk membantu saya memahaminya."
    },

    {
        type: "audio",
        icon: "🎧",
        text: "Saya mudah mengingati maklumat yang saya dengar."
    },

    {
        type: "audio",
        icon: "🎧",
        text: "Saya suka belajar melalui penerangan lisan, rakaman audio atau video yang mempunyai penerangan suara."
    },


    {
        type: "interpersonal",
        icon: "🤝",
        text: "Saya belajar dengan lebih baik apabila bekerja bersama rakan."
    },

    {
        type: "interpersonal",
        icon: "🤝",
        text: "Saya suka berkongsi idea dan pendapat dengan orang lain ketika belajar."
    },

    {
        type: "interpersonal",
        icon: "🤝",
        text: "Saya lebih berminat menyertai aktiviti pembelajaran secara berkumpulan."
    },

    {
        type: "interpersonal",
        icon: "🤝",
        text: "Saya suka membantu rakan dan belajar melalui kerjasama."
    },


    {
        type: "intrapersonal",
        icon: "🧠",
        text: "Saya lebih suka belajar secara bersendirian mengikut cara saya sendiri."
    },

    {
        type: "intrapersonal",
        icon: "🧠",
        text: "Saya suka membuat refleksi tentang perkara yang telah saya pelajari."
    },

    {
        type: "intrapersonal",
        icon: "🧠",
        text: "Saya mampu merancang sendiri cara dan masa untuk belajar."
    },

    {
        type: "intrapersonal",
        icon: "🧠",
        text: "Saya suka menetapkan matlamat pembelajaran untuk diri saya sendiri."
    }

];



/* =====================================================
   VARIABLES
===================================================== */

let currentQuestion = 0;

let answers = [];



/* =====================================================
   DOM ELEMENTS
===================================================== */

const sectionIcon =
    document.getElementById("sectionIcon");

const questionLabel =
    document.getElementById("questionLabel");

const questionText =
    document.getElementById("questionText");

const questionNumber =
    document.getElementById("questionNumber");

const topStep =
    document.getElementById("topStep");

const progressBar =
    document.getElementById("progressBar");

const backButton =
    document.getElementById("backButton");

const nextButton =
    document.getElementById("nextButton");

const likertOptions =
    document.querySelectorAll(".likert-option");



/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion() {

    const question =
        questions[currentQuestion];


    /* Icon */

    sectionIcon.textContent =
        question.icon;


    /* Question number */

    questionLabel.textContent =
        `QUESTION ${currentQuestion + 1}`;


    questionNumber.textContent =
        `${currentQuestion + 1} / ${questions.length}`;


    topStep.textContent =
        `STEP ${currentQuestion + 1} OF ${questions.length}`;


    /* Question text */

    questionText.textContent =
        question.text;


    /* Progress */

    const progress =
        ((currentQuestion + 1) / questions.length) * 100;

    progressBar.style.width =
        `${progress}%`;


    /* Remove selected */

    likertOptions.forEach(option => {

        option.classList.remove("selected");

    });


    /* Restore previous answer */

    if (answers[currentQuestion]) {

        const selected =
            document.querySelector(
                `.likert-option[data-value="${answers[currentQuestion]}"]`
            );

        if (selected) {

            selected.classList.add("selected");

        }

    }


    /* Back button */

    if (currentQuestion === 0) {

        backButton.disabled = true;

    } else {

        backButton.disabled = false;

    }


    /* Last question */

    if (currentQuestion === questions.length - 1) {

        nextButton.innerHTML =
            `Finish <span>✓</span>`;

    } else {

        nextButton.innerHTML =
            `Next <span>→</span>`;

    }

}



/* =====================================================
   LIKERT SELECTION
===================================================== */

likertOptions.forEach(option => {

    option.addEventListener("click", function() {


        /* Remove existing */

        likertOptions.forEach(item => {

            item.classList.remove("selected");

        });


        /* Select */

        this.classList.add("selected");


        /* Save */

        answers[currentQuestion] =
            Number(this.dataset.value);


    });

});



/* =====================================================
   NEXT BUTTON
===================================================== */

nextButton.addEventListener("click", function() {


    /* Check answer */

    if (!answers[currentQuestion]) {

        alert(
            "Sila pilih satu jawapan sebelum meneruskan."
        );

        return;

    }


    /* Next */

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        loadQuestion();


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


    } else {

        finishAssessment();

    }

});



/* =====================================================
   BACK BUTTON
===================================================== */

backButton.addEventListener("click", function() {


    if (currentQuestion > 0) {

        currentQuestion--;

        loadQuestion();


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

});



/* =====================================================
   CALCULATE SCORES
===================================================== */

function calculateScores() {


    const scores = {

        visual: 0,

        audio: 0,

        interpersonal: 0,

        intrapersonal: 0

    };


    questions.forEach((question, index) => {


        const answer =
            answers[index] || 0;


        scores[question.type] +=
            answer;

    });


    return scores;

}



/* =====================================================
   FIND DOMINANT STYLE
===================================================== */

function findDominant(scores) {


    let dominant =
        "visual";


    let highest =
        scores.visual;


    if (scores.audio > highest) {

        highest =
            scores.audio;

        dominant =
            "audio";

    }


    if (scores.interpersonal > highest) {

        highest =
            scores.interpersonal;

        dominant =
            "interpersonal";

    }


    if (scores.intrapersonal > highest) {

        highest =
            scores.intrapersonal;

        dominant =
            "intrapersonal";

    }


    return dominant;

}



/* =====================================================
   FINISH ASSESSMENT
===================================================== */

async function finishAssessment() {


    const scores =
        calculateScores();


    const dominantStyle =
        findDominant(scores);



    /* Student information */

    const studentId =
        localStorage.getItem("studentId") || "";

    const studentName =
        localStorage.getItem("studentName") || "";

    const programme =
        localStorage.getItem("studentProgramme") || "";

    const gender =
        localStorage.getItem("studentGender") || "";



    /* Result object */

    const result = {

        studentId: studentId,

        name: studentName,

        programme: programme,

        gender: gender,

        visual: scores.visual,

        audio: scores.audio,

        interpersonal: scores.interpersonal,

        intrapersonal: scores.intrapersonal,

        dominantStyle: dominantStyle,

        answers: answers,

        completedAt: new Date().toISOString()

    };



    /* Save locally */

    localStorage.setItem(
        "vassAssessmentResult",
        JSON.stringify(result)
    );



    /* Disable button */

    nextButton.disabled = true;

    nextButton.innerHTML =
        `Saving... <span>⏳</span>`;



    try {


        /* Send to Google Sheet */

        await fetch(
            GOOGLE_SCRIPT_URL,
            {

                method: "POST",

                mode: "no-cors",

                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },

                body: JSON.stringify(result)

            }
        );


        /*
        no-cors means browser cannot read
        the server response, but the request
        is sent to Apps Script.
        */


        window.location.href =
            "result.html";


    } catch (error) {


        console.error(error);


        alert(
            "Keputusan telah disimpan pada peranti. Sila teruskan."
        );


        window.location.href =
            "result.html";

    }

}



/* =====================================================
   INITIAL LOAD
===================================================== */

loadQuestion();


</script>


</body>

</html>
