<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VASS Assessment</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/assessment.css">
</head>

<body>

<header class="topbar">

    <div class="brand">

        <img
            src="assets/images/logo.png"
            alt="VASS Logo"
            class="brand-logo"
        >

        <div>
            <div class="brand-name">VASS</div>
            <div class="brand-subtitle">
                Learning Analytics System
            </div>
        </div>

    </div>

    <div class="step-text" id="stepText">
        STEP 1 OF 16
    </div>

</header>


<main class="assessment-container">

    <!-- PROGRESS -->

    <div class="progress-area">

        <div class="progress-track">

            <div
                class="progress-bar"
                id="progressBar">
            </div>

        </div>

        <div class="progress-info">
            <span id="questionCounter">
                1 / 16 Questions
            </span>
        </div>

    </div>


    <!-- QUESTION CARD -->

    <section class="question-card">

        <!-- SECTION ICON -->

        <div
            class="section-icon"
            id="sectionIcon">
            👁️
        </div>


        <!-- SECTION NAME -->

        <div
            class="section-name"
            id="sectionName">
            VISUAL
        </div>


        <!-- QUESTION NUMBER -->

        <div
            class="question-label"
            id="questionLabel">
            QUESTION 1
        </div>


        <!-- QUESTION -->

        <h1 id="questionText">
            Saya lebih mudah memahami sesuatu apabila maklumat dipersembahkan dalam bentuk gambar, warna atau rajah.
        </h1>


        <p class="instruction">
            Pilih jawapan yang paling menggambarkan diri anda.
        </p>


        <!-- LIKERT -->

        <div class="likert-container">

            <button
                class="likert-option"
                data-value="1">

                <span class="likert-number">1</span>

                <span class="likert-text">
                    Sangat Tidak Setuju
                </span>

            </button>


            <button
                class="likert-option"
                data-value="2">

                <span class="likert-number">2</span>

                <span class="likert-text">
                    Tidak Setuju
                </span>

            </button>


            <button
                class="likert-option"
                data-value="3">

                <span class="likert-number">3</span>

                <span class="likert-text">
                    Neutral
                </span>

            </button>


            <button
                class="likert-option"
                data-value="4">

                <span class="likert-number">4</span>

                <span class="likert-text">
                    Setuju
                </span>

            </button>


            <button
                class="likert-option"
                data-value="5">

                <span class="likert-number">5</span>

                <span class="likert-text">
                    Sangat Setuju
                </span>

            </button>

        </div>


        <!-- NAVIGATION -->

        <div class="navigation">

            <button
                class="nav-button back-button"
                id="backButton"
                onclick="previousQuestion()">

                ← Back

            </button>


            <button
                class="nav-button next-button"
                id="nextButton"
                onclick="nextQuestion()">

                Next →

            </button>

        </div>

    </section>

</main>


<script>

const questions = [

    /* ================= VISUAL ================= */

    {
        section: "VISUAL",
        icon: "👁️",
        question:
        "Saya lebih mudah memahami sesuatu apabila maklumat dipersembahkan dalam bentuk gambar, warna atau rajah."
    },

    {
        section: "VISUAL",
        icon: "👁️",
        question:
        "Saya suka menggunakan warna, simbol atau peta minda untuk membantu saya mengingati maklumat."
    },

    {
        section: "VISUAL",
        icon: "👁️",
        question:
        "Saya lebih mudah belajar apabila melihat contoh, ilustrasi atau demonstrasi visual."
    },

    {
        section: "VISUAL",
        icon: "👁️",
        question:
        "Saya suka menyusun nota menggunakan gambar rajah, carta atau warna yang berbeza."
    },


    /* ================= AUDITORY ================= */

    {
        section: "AUDITORY",
        icon: "🔊",
        question:
        "Saya lebih mudah memahami sesuatu apabila penerangan diberikan secara lisan."
    },

    {
        section: "AUDITORY",
        icon: "🔊",
        question:
        "Saya suka berbincang dengan orang lain untuk memahami sesuatu perkara."
    },

    {
        section: "AUDITORY",
        icon: "🔊",
        question:
        "Saya mudah mengingati maklumat yang saya dengar."
    },

    {
        section: "AUDITORY",
        icon: "🔊",
        question:
        "Saya suka mendengar penerangan atau rakaman audio ketika belajar."
    },


    /* ================= INTERPERSONAL ================= */

    {
        section: "INTERPERSONAL",
        icon: "🤝",
        question:
        "Saya suka belajar bersama rakan kerana perbincangan membantu saya memahami sesuatu."
    },

    {
        section: "INTERPERSONAL",
        icon: "🤝",
        question:
        "Saya berasa lebih yakin apabila dapat berkongsi idea dengan orang lain."
    },

    {
        section: "INTERPERSONAL",
        icon: "🤝",
        question:
        "Saya suka melakukan aktiviti pembelajaran secara berkumpulan."
    },

    {
        section: "INTERPERSONAL",
        icon: "🤝",
        question:
        "Saya mudah mendapat idea baharu apabila berinteraksi dengan orang lain."
    },


    /* ================= INTRAPERSONAL ================= */

    {
        section: "INTRAPERSONAL",
        icon: "🧠",
        question:
        "Saya lebih suka belajar secara sendiri mengikut cara dan tempo saya."
    },

    {
        section: "INTRAPERSONAL",
        icon: "🧠",
        question:
        "Saya suka mengambil masa untuk berfikir sebelum memberikan jawapan."
    },

    {
        section: "INTRAPERSONAL",
        icon: "🧠",
        question:
        "Saya suka menilai sendiri kekuatan dan kelemahan saya dalam pembelajaran."
    },

    {
        section: "INTRAPERSONAL",
        icon: "🧠",
        question:
        "Saya lebih selesa membuat keputusan pembelajaran berdasarkan pertimbangan diri sendiri."
    }

];


let currentQuestion = 0;

let answers = new Array(questions.length).fill(null);


// DOM

const sectionIcon =
    document.getElementById("sectionIcon");

const sectionName =
    document.getElementById("sectionName");

const questionLabel =
    document.getElementById("questionLabel");

const questionText =
    document.getElementById("questionText");

const progressBar =
    document.getElementById("progressBar");

const questionCounter =
    document.getElementById("questionCounter");

const stepText =
    document.getElementById("stepText");

const backButton =
    document.getElementById("backButton");

const nextButton =
    document.getElementById("nextButton");


// LIKERT BUTTONS

const likertButtons =
    document.querySelectorAll(".likert-option");


likertButtons.forEach(button => {

    button.addEventListener("click", function() {

        const value =
            Number(this.dataset.value);

        answers[currentQuestion] = value;

        likertButtons.forEach(btn => {
            btn.classList.remove("selected");
        });

        this.classList.add("selected");

    });

});


// LOAD QUESTION

function loadQuestion() {

    const q =
        questions[currentQuestion];


    // Section icon

    sectionIcon.textContent =
        q.icon;


    // Section name

    sectionName.textContent =
        q.section;


    // Question number

    questionLabel.textContent =
        "QUESTION " + (currentQuestion + 1);


    // Question

    questionText.textContent =
        q.question;


    // Progress

    const progress =
        ((currentQuestion + 1) /
        questions.length) * 100;

    progressBar.style.width =
        progress + "%";


    questionCounter.textContent =
        (currentQuestion + 1) +
        " / " +
        questions.length +
        " Questions";


    stepText.textContent =
        "STEP " +
        (currentQuestion + 1) +
        " OF " +
        questions.length;


    // Selected answer

    likertButtons.forEach(button => {

        button.classList.remove("selected");

        if (
            Number(button.dataset.value) ===
            answers[currentQuestion]
        ) {

            button.classList.add("selected");

        }

    });


    // Back button

    if (currentQuestion === 0) {

        backButton.style.visibility =
            "hidden";

    } else {

        backButton.style.visibility =
            "visible";

    }


    // Last question

    if (
        currentQuestion ===
        questions.length - 1
    ) {

        nextButton.textContent =
            "Finish ✓";

    } else {

        nextButton.textContent =
            "Next →";

    }

}


// NEXT

function nextQuestion() {

    if (
        answers[currentQuestion] === null
    ) {

        alert(
            "Sila pilih satu jawapan terlebih dahulu."
        );

        return;

    }


    if (
        currentQuestion <
        questions.length - 1
    ) {

        currentQuestion++;

        loadQuestion();

    } else {

        finishAssessment();

    }

}


// BACK

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        loadQuestion();

    }

}


// FINISH

function finishAssessment() {

    const visual =
        answers[0] +
        answers[1] +
        answers[2] +
        answers[3];


    const audio =
        answers[4] +
        answers[5] +
        answers[6] +
        answers[7];


    const interpersonal =
        answers[8] +
        answers[9] +
        answers[10] +
        answers[11];


    const intrapersonal =
        answers[12] +
        answers[13] +
        answers[14] +
        answers[15];


    const scores = {

        visual: visual,

        audio: audio,

        interpersonal: interpersonal,

        intrapersonal: intrapersonal

    };


    localStorage.setItem(
        "vassScores",
        JSON.stringify(scores)
    );


    const dominantStyle =
        Object.keys(scores).reduce(
            (a, b) =>
            scores[a] > scores[b] ? a : b
        );


    localStorage.setItem(
        "dominantStyle",
        dominantStyle
    );


    window.location.href =
        "result.html";

}


// START

loadQuestion();

</script>

</body>
</html>
