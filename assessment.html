<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =========================================================
   BODY
========================================================= */

body{

    font-family:'Poppins',sans-serif;

    min-height:100vh;

    color:#ffffff;

    background:
        radial-gradient(
            circle at 10% 20%,
            rgba(0,198,255,0.16),
            transparent 32%
        ),

        radial-gradient(
            circle at 90% 80%,
            rgba(91,72,255,0.18),
            transparent 32%
        ),

        linear-gradient(
            135deg,
            #06152f 0%,
            #0b2450 50%,
            #07162f 100%
        );

    padding:40px 20px;

}


/* =========================================================
   CONTAINER
========================================================= */

.assessment-container{

    width:100%;

    max-width:1150px;

    margin:auto;

}


/* =========================================================
   HEADER
========================================================= */

.assessment-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:30px;

}


.assessment-header h1{

    font-size:32px;

    font-weight:800;

    line-height:1.2;

}


.assessment-header p{

    margin-top:6px;

    color:rgba(255,255,255,0.62);

    font-size:14px;

}


.question-counter{

    padding:12px 20px;

    border-radius:15px;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid
        rgba(255,255,255,0.14);

    backdrop-filter:blur(15px);

    font-size:14px;

    font-weight:600;

    white-space:nowrap;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress-section{

    margin-bottom:25px;

}


.progress-info{

    display:flex;

    justify-content:space-between;

    margin-bottom:9px;

    color:
        rgba(255,255,255,0.68);

    font-size:13px;

}


.progress-bar{

    width:100%;

    height:8px;

    overflow:hidden;

    border-radius:20px;

    background:
        rgba(255,255,255,0.10);

}


.progress-fill{

    width:3.333%;

    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #00c6ff,
            #4facfe
        );

    box-shadow:
        0 0 15px
        rgba(0,198,255,0.45);

    transition:
        width .35s ease;

}


/* =========================================================
   QUESTION CARD
========================================================= */

.question-wrapper{

    --category-color:#00c6ff;

    --category-glow:
        rgba(0,198,255,.30);

    padding:38px;

    border-radius:28px;

    background:
        rgba(255,255,255,0.075);

    border:
        1px solid
        rgba(255,255,255,0.13);

    backdrop-filter:blur(22px);

    -webkit-backdrop-filter:blur(22px);

    box-shadow:

        0 25px 70px
        rgba(0,0,0,.30),

        0 0 40px
        var(--category-glow);

    transition:.35s ease;

}


/* =========================================================
   CATEGORY
========================================================= */

.category-section{

    display:flex;

    align-items:center;

    gap:16px;

    margin-bottom:30px;

}


.category-icon{

    width:62px;

    height:62px;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-shrink:0;

    border-radius:18px;

    color:
        var(--category-color);

    border:
        1px solid
        var(--category-color);

    background:
        rgba(255,255,255,.07);

    box-shadow:
        0 0 25px
        var(--category-glow);

    font-size:28px;

}


.category-badge{

    color:
        var(--category-color);

    font-size:14px;

    font-weight:800;

    letter-spacing:1.4px;

}


.category-description{

    margin-top:4px;

    color:
        rgba(255,255,255,.55);

    font-size:12px;

}


/* =========================================================
   QUESTION BOX
========================================================= */

.question-box{

    padding:30px;

    margin-bottom:30px;

    border-radius:20px;

    background:
        rgba(0,0,0,.13);

    border:
        1px solid
        rgba(255,255,255,.08);

}


.question-label{

    display:block;

    margin-bottom:14px;

    color:
        var(--category-color);

    font-size:11px;

    font-weight:800;

    letter-spacing:2px;

}


#questionText{

    font-size:24px;

    line-height:1.6;

    font-weight:600;

    color:#ffffff;

}


/* =========================================================
   ANSWERS
========================================================= */

.answers-container{

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:14px;

}


.answer-card{

    min-height:125px;

    padding:15px;

    border-radius:18px;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.055);

    color:#ffffff;

    cursor:pointer;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:12px;

    font-family:inherit;

    transition:.25s ease;

}


.answer-card:hover{

    transform:
        translateY(-5px);

    background:
        rgba(255,255,255,.11);

}


.answer-number{

    width:40px;

    height:40px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:
        rgba(255,255,255,.10);

    font-weight:800;

}


.answer-text{

    text-align:center;

    font-size:12px;

    font-weight:600;

    line-height:1.35;

}


/* =========================================================
   ANSWER SELECTED
========================================================= */

.answer-card.selected{

    transform:
        translateY(-4px);

}


.answer-card:nth-child(1).selected{

    border-color:#ff4d5a;

    background:
        rgba(255,77,90,.18);

    box-shadow:
        0 0 25px
        rgba(255,77,90,.25);

}


.answer-card:nth-child(2).selected{

    border-color:#ff9f43;

    background:
        rgba(255,159,67,.18);

    box-shadow:
        0 0 25px
        rgba(255,159,67,.25);

}


.answer-card:nth-child(3).selected{

    border-color:#aab2bd;

    background:
        rgba(170,178,189,.18);

    box-shadow:
        0 0 25px
        rgba(170,178,189,.22);

}


.answer-card:nth-child(4).selected{

    border-color:#4facfe;

    background:
        rgba(79,172,254,.18);

    box-shadow:
        0 0 25px
        rgba(79,172,254,.25);

}


.answer-card:nth-child(5).selected{

    border-color:#3ee58a;

    background:
        rgba(62,229,138,.18);

    box-shadow:
        0 0 25px
        rgba(62,229,138,.25);

}


/* =========================================================
   NAVIGATION
========================================================= */

.navigation{

    display:flex;

    justify-content:space-between;

    gap:15px;

    margin-top:25px;

}


.nav-btn{

    border:none;

    border-radius:14px;

    padding:14px 25px;

    font-family:inherit;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

    transition:.25s ease;

}


.previous-btn{

    color:
        rgba(255,255,255,.78);

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.12);

}


.previous-btn:hover:not(:disabled){

    background:
        rgba(255,255,255,.14);

    transform:
        translateX(-3px);

}


.next-btn{

    color:#ffffff;

    background:
        linear-gradient(
            135deg,
            #00a8ff,
            #0066ff
        );

    box-shadow:
        0 8px 25px
        rgba(0,140,255,.25);

}


.next-btn:hover{

    transform:
        translateX(3px);

}


.nav-btn:disabled{

    opacity:.35;

    cursor:not-allowed;

}


/* =========================================================
   MESSAGE
========================================================= */

.message{

    min-height:22px;

    margin-top:15px;

    text-align:center;

    color:#ffb3b3;

    font-size:13px;

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

    .answers-container{

        grid-template-columns:
            repeat(2,1fr);

    }

    .answer-card:last-child{

        grid-column:
            span 2;

    }

}


@media(max-width:600px){

    body{

        padding:20px 12px;

    }


    .assessment-header{

        flex-direction:column;

        align-items:flex-start;

        gap:15px;

    }


    .assessment-header h1{

        font-size:25px;

    }


    .question-counter{

        width:100%;

        text-align:center;

    }


    .question-wrapper{

        padding:22px;

        border-radius:22px;

    }


    .question-box{

        padding:20px;

    }


    #questionText{

        font-size:18px;

        line-height:1.55;

    }


    .answers-container{

        grid-template-columns:1fr;

    }


    .answer-card:last-child{

        grid-column:auto;

    }


    .answer-card{

        min-height:72px;

        flex-direction:row;

        justify-content:flex-start;

        padding:14px 18px;

    }


    .answer-text{

        text-align:left;

    }


    .navigation{

        gap:10px;

    }


    .nav-btn{

        flex:1;

    }

}

</style>

</head>

        q.description;


    /* QUESTION NUMBER */

    questionNumber.textContent =
        String(
            q.id
        ).padStart(
            2,
            "0"
        );


    currentQuestion.textContent =
        q.id;


    /* QUESTION */

    questionText.textContent =
        q.text;


    /* CATEGORY COLOUR */

    const style =
        categoryStyles[
            q.category
        ];


    questionWrapper.style.setProperty(
        "--category-color",
        style.color
    );


    questionWrapper.style.setProperty(
        "--category-glow",
        style.glow
    );


    /* PROGRESS */

    const progress =
        (
            (current + 1)
            /
            questions.length
        ) * 100;


    progressFill.style.width =
        progress + "%";


    progressPercent.textContent =
        Math.round(progress)
        + "%";


    /* ANSWERS */

    renderAnswers();


    /* PREVIOUS */

    previousBtn.disabled =
        current === 0;


    /* LAST BUTTON */

    if(
        current ===
        questions.length - 1
    ){

        nextBtn.textContent =
            "Finish ✓";

    }else{

        nextBtn.textContent =
            "Next →";

    }


    message.textContent = "";

}


/* =========================================================
   RENDER ANSWERS
========================================================= */

function renderAnswers(){

    answersContainer.innerHTML = "";


    likert.forEach(
        function(option){

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "answer-card";


            button.dataset.value =
                option.value;


            button.innerHTML = `

                <span class="answer-number">

                    ${option.value}

                </span>

                <span class="answer-text">

                    ${option.text}

                </span>

            `;


            /* SELECTED */

            if(
                answers[current]
                ===
                option.value
            ){

                button.classList.add(
                    "selected"
                );

            }


            /* CLICK */

            button.addEventListener(
                "click",
                function(){

                    answers[current] =
                        option.value;


                    localStorage.setItem(
                        "vassAnswers",
                        JSON.stringify(
                            answers
                        )
                    );


                    renderAnswers();


                    message.textContent =
                        "";

                }
            );


            answersContainer.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   NEXT
========================================================= */

nextBtn.addEventListener(
    "click",
    function(){

        /* MUST ANSWER */

        if(
            answers[current]
            ===
            undefined
        ){

            message.textContent =
                "Sila pilih satu jawapan terlebih dahulu.";

            return;

        }


        /* FINISH */

        if(
            current ===
            questions.length - 1
        ){

            finishAssessment();

            return;

        }


        /* NEXT */

        current++;

        loadQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
);


/* =========================================================
   PREVIOUS
========================================================= */

previousBtn.addEventListener(
    "click",
    function(){

        if(
            current === 0
        ){

            return;

        }


        current--;

        loadQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
);


/* =========================================================
   CALCULATE RAW SCORES
========================================================= */

function calculateScores(){

    const raw = {

        visual:0,

        audio:0,

        interpersonal:0,

        intrapersonal:0

    };


    questions.forEach(
        function(q,index){

            const answer =
                Number(
                    answers[index]
                ) || 0;


            raw[q.category] +=
                answer;

        }
    );


    return raw;

}


/* =========================================================
   CALCULATE PERCENTAGE
=========================================================

   Visual       = 8 × 5 = 40
   Audio        = 9 × 5 = 45
   Interpersonal= 7 × 5 = 35
   Intrapersonal= 6 × 5 = 30

========================================================= */

function calculatePercentage(
    raw
){

    return {

        visual:
            Math.round(
                (
                    raw.visual /
                    40
                ) * 100
            ),

        audio:
            Math.round(
                (
                    raw.audio /
                    45
                ) * 100
            ),

        interpersonal:
            Math.round(
                (
                    raw.interpersonal /
                    35
                ) * 100
            ),

        intrapersonal:
            Math.round(
                (
                    raw.intrapersonal /
                    30
                ) * 100
            )

    };

}


/* =========================================================
   FIND DOMINANT
========================================================= */

function findDominant(
    scores
){

    const categories = [

        "visual",

        "audio",

        "interpersonal",

        "intrapersonal"

    ];


    let dominant =
        categories[0];


    categories.forEach(
        function(category){

            if(
                scores[category]
                >
                scores[dominant]
            ){

                dominant =
                    category;

            }

        }
    );


    return dominant;

}


/* =========================================================
   FINISH
========================================================= */

function finishAssessment(){

    /* CHECK ALL */

    const incomplete =
        answers.some(
            function(answer){

                return answer ===
                    undefined;

            }
        );


    if(incomplete){

        message.textContent =
            "Sila lengkapkan semua 30 soalan.";

        return;

    }


    /* RAW */

    const raw =
        calculateScores();


    /* PERCENTAGE */

    const scores =
        calculatePercentage(
            raw
        );


    /* DOMINANT */

    const dominant =
        findDominant(
            scores
        );


    /* RESULT */

    const result = {

        rawScores:{

            visual:
                raw.visual,

            audio:
                raw.audio,

            interpersonal:
                raw.interpersonal,

            intrapersonal:
                raw.intrapersonal

        },


        scores:{

            visual:
                scores.visual,

            audio:
                scores.audio,

            interpersonal:
                scores.interpersonal,

            intrapersonal:
                scores.intrapersonal

        },


        dominantStyle:
            dominant,


        totalQuestions:
            30,


        completedAt:
            new Date().toISOString()

    };


    /* SAVE RESULT */

    localStorage.setItem(
        "vassAssessmentResult",
        JSON.stringify(
            result
        )
    );


    localStorage.setItem(
        "vassAnswers",
        JSON.stringify(
            answers
        )
    );


    /* SAVE INDIVIDUAL SCORES */

    localStorage.setItem(
        "visualScore",
        raw.visual
    );


    localStorage.setItem(
        "audioScore",
        raw.audio
    );


    localStorage.setItem(
        "interpersonalScore",
        raw.interpersonal
    );


    localStorage.setItem(
        "intrapersonalScore",
        raw.intrapersonal
    );


    localStorage.setItem(
        "visualPercentage",
        scores.visual
    );


    localStorage.setItem(
        "audioPercentage",
        scores.audio
    );


    localStorage.setItem(
        "interpersonalPercentage",
        scores.interpersonal
    );


    localStorage.setItem(
        "intrapersonalPercentage",
        scores.intrapersonal
    );


    localStorage.setItem(
        "dominantStyle",
        dominant
    );


    /* GO DASHBOARD */

    window.location.href =
        "dashboard.html";

}


/* =========================================================
   START
========================================================= */

loadQuestion();

</script>
