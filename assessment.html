    <!-- QUESTION -->

            </div>

                </div>

            </div>

        </div>


        <!-- QUESTION BOX -->
        <div class="question-box">

            </span>

        <!-- ANSWERS -->

    <!-- NAVIGATION -->

        <button
            id="previousBtn"
            class="nav-btn previous-btn"
            disabled>
            ← Previous

        <button
            id="nextBtn"
            class="nav-btn next-btn">
            Next →

    </div>


    <!-- MESSAGE -->

</div>

    },

    {
        id: 28,

        name: "INTRAPERSONAL",
        icon: "🧠",

        text: "Apabila saya bekerja sendiri, saya belajar dengan lebih baik."
    },

    {
        id: 29,
        category: "intrapersonal",
        name: "INTRAPERSONAL",
        icon: "🧠",
        description: "Reflect • Explore • Learn",
        text: "Saya lebih suka mengusahakan projek sendiri."
    },

    {
        id: 30,
        category: "intrapersonal",
        name: "INTRAPERSONAL",
        icon: "🧠",
        description: "Reflect • Explore • Learn",
        text: "Saya lebih suka bekerja sendiri."
    }

];


/* =========================================
   VARIABLES
========================================= */

let current = 0;

let answers = {};


/* =========================================
   ELEMENTS
========================================= */

const wrapper =
    document.getElementById("questionWrapper");

const currentQuestion =
    document.getElementById("currentQuestion");

const questionNumber =
    document.getElementById("questionNumber");

const questionText =
    document.getElementById("questionText");

const categoryIcon =
    document.getElementById("categoryIcon");

const categoryName =
    document.getElementById("categoryName");

const categoryDescription =
    document.getElementById("categoryDescription");

const answersContainer =
    document.getElementById("answersContainer");

const progressFill =
    document.getElementById("progressFill");

const progressPercent =
    document.getElementById("progressPercent");

const previousBtn =
    document.getElementById("previousBtn");

const nextBtn =
    document.getElementById("nextBtn");

const message =
    document.getElementById("message");


/* =========================================
   LOAD QUESTION
========================================= */

function loadQuestion() {

    const q = questions[current];

    currentQuestion.textContent =
        q.id;

    questionNumber.textContent =
        String(q.id).padStart(2, "0");

    questionText.textContent =
        q.text;

    categoryIcon.textContent =
        q.icon;

    categoryName.textContent =
        q.name;

    categoryDescription.textContent =
        q.description;

    wrapper.className =
        "question-wrapper " + q.category;


    /* Progress */

    const progress =
        (q.id / questions.length) * 100;

    progressFill.style.width =
        progress + "%";

    progressPercent.textContent =
        Math.round(progress) + "%";


    /* Previous */

    previousBtn.disabled =
        current === 0;


    /* Next */

    if (current === questions.length - 1) {

        nextBtn.textContent =
            "Finish ✓";

    } else {

        nextBtn.textContent =
            "Next →";

    }


    /* Answers */

    renderAnswers(q);

    message.textContent = "";
}


/* =========================================
   RENDER ANSWERS
========================================= */

function renderAnswers(q) {

    answersContainer.innerHTML = "";


    const options = [

        {
            value: 1,
            text: "Strongly Disagree",
            className: "strongly-disagree"
        },

        {
            value: 2,
            text: "Disagree",
            className: "disagree"
        },

        {
            value: 3,
            text: "Neutral",
            className: "neutral"
        },

        {
            value: 4,
            text: "Agree",
            className: "agree"
        },

        {
            value: 5,
            text: "Strongly Agree",
            className: "strongly-agree"
        }

    ];


    options.forEach(function(option) {

        const button =
            document.createElement("button");

        button.type = "button";

        button.className =
            "answer-card " + option.className;

        button.innerHTML = `
            <span class="answer-number">
                ${option.value}
            </span>

            <span>
                ${option.text}
            </span>
        `;


        /* Previously selected */

        if (
            answers[q.id] ===
            option.value
        ) {

            button.classList.add("selected");

        }


        /* Click */

        button.addEventListener(
            "click",
            function() {

                answers[q.id] =
                    option.value;


                document
                    .querySelectorAll(".answer-card")
                    .forEach(function(item) {

                        item.classList.remove(
                            "selected"
                        );

                    });


                button.classList.add(
                    "selected"
                );


                localStorage.setItem(
                    "vassAnswers",
                    JSON.stringify(answers)
                );


                message.textContent = "";

            }
        );


        answersContainer.appendChild(button);

    });
}


/* =========================================
   NEXT
========================================= */

nextBtn.addEventListener(
    "click",
    function() {

        const q =
            questions[current];


        /* No answer */

        if (
            answers[q.id] ===
            undefined
        ) {

            message.textContent =
                "Please select an answer before continuing.";

            return;

        }


        /* Finish */

        if (
            current ===
            questions.length - 1
        ) {

            finishAssessment();

            return;

        }


        current++;

        loadQuestion();

    }
);


/* =========================================
   PREVIOUS
========================================= */

previousBtn.addEventListener(
    "click",
    function() {

        if (current === 0) {
            return;
        }

        current--;

        loadQuestion();

    }
);


/* =========================================
   CALCULATE SCORE
========================================= */

function calculateScores() {

    const raw = {

        visual: 0,

        audio: 0,

        interpersonal: 0,

        intrapersonal: 0

    };


    questions.forEach(function(q) {

        if (
            answers[q.id] !==
            undefined
        ) {

            raw[q.category] +=
                Number(answers[q.id]);

        }

    });


    return raw;
}


/* =========================================
   SCORE /100
========================================= */

function calculatePercentage(raw) {

    return {

        visual:
            Math.round(
                (raw.visual / 40) * 100
            ),

        audio:
            Math.round(
                (raw.audio / 45) * 100
            ),

        interpersonal:
            Math.round(
                (raw.interpersonal / 35) * 100
            ),

        intrapersonal:
            Math.round(
                (raw.intrapersonal / 30) * 100
            )

    };

}


/* =========================================
   DOMINANT STYLE
========================================= */

function findDominant(scores) {

    let dominant =
        "visual";

    let highest =
        scores.visual;


    Object.keys(scores).forEach(
        function(category) {

            if (
                scores[category] >
                highest
            ) {

                highest =
                    scores[category];

                dominant =
                    category;

            }

        }
    );


    return dominant;
}


/* =========================================
   FINISH
========================================= */

function finishAssessment() {

    const raw =
        calculateScores();


    const scores =
        calculatePercentage(raw);


    const dominant =
        findDominant(scores);


    const result = {

        rawScores: raw,

        scores: scores,

        dominantStyle:
            dominant,

        totalQuestions:
            30,

        completedAt:
            new Date().toISOString()

    };


    localStorage.setItem(
        "vassAssessmentResult",
        JSON.stringify(result)
    );


    localStorage.setItem(
        "vassAnswers",
        JSON.stringify(answers)
    );


    window.location.href =
        "dashboard.html";
}


/* =========================================
   START
========================================= */

loadQuestion();

</script>
