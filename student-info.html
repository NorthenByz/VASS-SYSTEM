<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Let's Get Started | VASS</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="css/student.css">

</head>


<body>


<div class="student-container">


    <div class="student-card">


        <div class="progress-text">
            Step 2 of 3
        </div>


        <img
            src="assets/images/logo.png"
            class="student-logo"
            alt="VASS Logo">


        <h1>
            Let's Get Started
        </h1>


        <p>
            Before beginning your learning journey,
            tell us a little about yourself.
        </p>


        <!-- ================= FORM ================= -->

        <form id="studentForm">


            <!-- FULL NAME -->

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    class="form-control"
                    placeholder="Enter your full name"
                    required>

            </div>


            <!-- STUDENT ID -->

            <div class="mb-3">

                <label class="form-label">
                    Student ID
                </label>

                <input
                    type="text"
                    id="studentId"
                    class="form-control"
                    placeholder="Enter your student ID"
                    required>

            </div>


            <!-- PROGRAMME / CLASS -->

            <div class="mb-3">

                <label class="form-label">
                    Programme / Class
                </label>

                <input
                    type="text"
                    id="programme"
                    class="form-control"
                    placeholder="Example : Bachelor of Education"
                    required>

            </div>


            <!-- GENDER -->

            <div class="mb-4">

                <label class="form-label">
                    Gender
                </label>

                <select
                    id="gender"
                    class="form-select"
                    required>

                    <option value="" selected disabled>
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                </select>

            </div>


            <!-- CONTINUE BUTTON -->

            <button
                type="submit"
                class="btn btn-light w-100">

                Continue →

            </button>


        </form>

    </div>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script>

document
    .getElementById("studentForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        // Get values

        const fullName =
            document
            .getElementById("fullName")
            .value
            .trim();

        const studentId =
            document
            .getElementById("studentId")
            .value
            .trim();

        const programme =
            document
            .getElementById("programme")
            .value
            .trim();

        const gender =
            document
            .getElementById("gender")
            .value;


        // Check all fields

        if (
            fullName === "" ||
            studentId === "" ||
            programme === "" ||
            gender === ""
        ) {

            alert("Please complete all student information before continuing.");

            return;

        }


        // Save student information

        localStorage.setItem(
            "studentName",
            fullName
        );

        localStorage.setItem(
            "studentId",
            studentId
        );

        localStorage.setItem(
            "studentProgramme",
            programme
        );

        localStorage.setItem(
            "studentGender",
            gender
        );


        // Go to assessment

        window.location.href =
            "assessment.html";

    });

</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
